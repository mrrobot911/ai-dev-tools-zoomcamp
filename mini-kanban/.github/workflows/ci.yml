name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Lint backend with ruff
        run: |
          cd backend
          ruff check .
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Lint frontend with eslint
        run: |
          cd frontend
          npm run lint

  test-backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        run: |
          cd backend
          uv sync
          
      - name: Run unit tests
        run: |
          cd backend
          uv run pytest tests/ -v

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minikanban
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        run: |
          cd backend
          uv sync
          
      - name: Run alembic migrations
        run: |
          cd backend
          uv run alembic upgrade head
          
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/minikanban
          BACKEND_URL: http://localhost:8000
        run: |
          cd backend
          uv run pytest tests/integration/ -v

  test-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: |
          docker build -t mini-kanban:latest .